# --- NEXUS_AI_SYSTEM/config/default.yaml ---

# Configuration du modèle
model:
  vocab_size: 50257      # Mis à jour automatiquement par main.py (GPT-2)
  hidden_size: 128      # Dimension des embeddings et des couches cachées
  num_hidden_layers: 4  # Nombre de blocs Transformer
  num_attention_heads: 4 # Nombre de têtes d'attention
  block_size: 256       # Longueur de contexte maximale

# Configuration de l'entraînement
training:
  learning_rate: 0.0003 # Taux d'apprentissage
  batch_size: 8         # Taille des lots
  epochs: 3             # Nombre d'époques d'entraînement
  device: 'auto'      # 'auto' (sélectionne cuda si disponible), 'cpu', ou 'cuda'

# Configuration du pipeline de données
data:
  use_dummy_data: false # Passer à false pour utiliser le corpus.txt
  dummy_corpus_size: 100000 # Ignoré si use_dummy_data est false
